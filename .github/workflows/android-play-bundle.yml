name: GPS Ecuador Play Bundle
on:
  workflow_dispatch:
jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check signing secrets
        env:
          GPS_KEYSTORE_BASE64: ${{ secrets.GPS_KEYSTORE_BASE64 }}
          GPS_UPLOAD_STORE_PASSWORD: ${{ secrets.GPS_UPLOAD_STORE_PASSWORD }}
        run: |
          test -n "$GPS_KEYSTORE_BASE64" || { echo "Missing GPS_KEYSTORE_BASE64"; exit 1; }
          test -n "$GPS_UPLOAD_STORE_PASSWORD" || { echo "Missing GPS_UPLOAD_STORE_PASSWORD"; exit 1; }
      - name: Restore private signing key
        env:
          GPS_KEYSTORE_BASE64: ${{ secrets.GPS_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$GPS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gps-upload.jks"
      - name: Build signed Play AAB
        working-directory: android
        env:
          GPS_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/gps-upload.jks
          GPS_UPLOAD_STORE_PASSWORD: ${{ secrets.GPS_UPLOAD_STORE_PASSWORD }}
          GPS_UPLOAD_KEY_PASSWORD: ${{ secrets.GPS_UPLOAD_STORE_PASSWORD }}
          GPS_UPLOAD_KEY_ALIAS: gps-ecuador-upload
        run: gradle --no-daemon bundleRelease
      - name: Verify app ID
        run: grep -F 'applicationId = "ec.gpsecuador.mobile"' android/app/build.gradle.kts
      - name: Save signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Ecuador-Play-signed-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
