name: GPS Ecuador backend tests
on:
  push:
    branches: [develop/gps-backend-no-traccar]
  pull_request:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - name: Validate backup shell script
        run: bash -n scripts/backup-postgres.sh
