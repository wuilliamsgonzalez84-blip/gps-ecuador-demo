name: Customer HTTP PostgreSQL integration
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/customer-http-integration.yml'
  push:
    branches:
      - feature/private-client-access
jobs:
  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: temporary-ci-password
          POSTGRES_DB: gps_http_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gps_http_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: temporary-ci-password
      PGDATABASE: gps_http_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare disposable vehicle and position tables
        run: |
          psql -v ON_ERROR_STOP=1 -c 'CREATE TABLE public.vehicles(id bigint PRIMARY KEY);'
          psql -v ON_ERROR_STOP=1 -c 'CREATE TABLE public.positions(vehicle_id bigint REFERENCES public.vehicles(id),latitude double precision,longitude double precision,recorded_at timestamptz NOT NULL);'
          psql -v ON_ERROR_STOP=1 -f migrations/001_customer_access.sql
          psql -v ON_ERROR_STOP=1 -f migrations/002_customer_sessions.sql
      - name: Verify real HTTP sessions and customer isolation
        run: node integration/http-check.js
