name: Live customer login negative smoke test
on:
  workflow_dispatch:
  push:
    branches: [feature/private-live-api-integration]
    paths: ['.github/workflows/live-customer-login-smoke.yml']
permissions:
  contents: read
jobs:
  live-login:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check HTTPS customer login without credentials
        shell: bash
        run: |
          set -euo pipefail
          url='https://45-77-197-18.sslip.io/api/customer/login'
          response=$(curl --silent --show-error --location --max-time 20 --output /tmp/gps-login-response --write-out '%{http_code}' --header 'Content-Type: application/json' --data '{"email":"nobody@example.invalid","password":"invalid-test-password"}' "$url")
          echo "Customer login invalid credentials HTTP $response"
          if [ "$response" != 401 ]; then
            echo "Expected 401 for invalid credentials. No valid account tested."
            exit 1
          fi
          echo "HTTPS customer login correctly rejected invalid credentials"
