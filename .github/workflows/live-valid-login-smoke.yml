name: Live valid customer login smoke test
on:
  workflow_dispatch:
  push:
    branches: [feature/private-live-api-integration]
    paths: ['.github/workflows/live-valid-login-smoke.yml']
permissions:
  contents: read
concurrency:
  group: gps-customer-route-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify temporary valid account and revoke it
        env:
          HOST: ${{ secrets.GPS_VULTR_HOST }}
          USER: ${{ secrets.GPS_VULTR_USER }}
          SSH_KEY: ${{ secrets.GPS_VULTR_SSH_KEY }}
          FINGERPRINT: ${{ secrets.GPS_VULTR_HOST_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          trap 'rm -f ~/.ssh/gps_ci_key ~/.ssh/known_hosts ~/.ssh/scanned_hosts' EXIT
          python3 - <<'PY'
          import os, re, base64, subprocess
          from pathlib import Path
          raw = os.environ["SSH_KEY"].strip().lstrip("\ufeff")
          raw = raw.replace("\\r\\n", "\n").replace("\\n", "\n").replace("\r", "")
          if raw[:1] in ("'", '"') and raw[-1:] == raw[:1]:
              raw = raw[1:-1].strip()
          if "-----BEGIN " not in raw:
              try:
                  raw = base64.b64decode(re.sub(r"\s+", "", raw), validate=True).decode("ascii")
              except (ValueError, UnicodeError):
                  raise SystemExit("El secreto no contiene una clave privada completa; recuperar la misma clave original.")
          match = re.fullmatch(r"\s*-----BEGIN (OPENSSH PRIVATE KEY|RSA PRIVATE KEY|EC PRIVATE KEY|PRIVATE KEY|ENCRYPTED PRIVATE KEY)-----\s*(.*?)\s*-----END \1-----\s*", raw, re.S)
          if not match:
              raise SystemExit("Cabecera o cierre de clave incompleto; recuperar la misma clave original.")
          kind, body = match.groups()
          if "Proc-Type:" in body:
              normalized = raw.strip() + "\n"
          else:
              body = re.sub(r"\s+", "", body)
              try:
                  base64.b64decode(body, validate=True)
              except ValueError:
                  raise SystemExit("Contenido de clave incompleto o alterado; recuperar la misma clave original.")
              normalized = "-----BEGIN " + kind + "-----\n" + "\n".join(body[i:i+64] for i in range(0, len(body), 64)) + "\n-----END " + kind + "-----\n"
          path = Path.home() / ".ssh/gps_ci_key"
          path.write_text(normalized, encoding="ascii")
          path.chmod(0o600)
          result = subprocess.run(["ssh-keygen", "-y", "-P", "", "-f", str(path)], stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
          if result.returncode:
              error = result.stderr.decode(errors="replace").lower()
              if "passphrase" in error or kind == "ENCRYPTED PRIVATE KEY":
                  raise SystemExit("La clave existente requiere frase de acceso.")
              raise SystemExit("La clave sigue incompleta o alterada tras normalizar; recuperar la misma clave original.")
          print("Clave privada existente validada; contenido oculto.")
          PY
          ssh-keyscan -T 10 -t ed25519,ecdsa,rsa "$HOST" 2>/dev/null > ~/.ssh/scanned_hosts
          test -s ~/.ssh/scanned_hosts || { echo "No se obtuvo clave publica del servidor"; exit 1; }
          # Accept the SHA256 token alone or the complete ssh-keygen output.
          # Require exactly one fingerprint; never trust an unverified scanned key.
          expected=$(python3 - <<'PY'
          import os, re
          value = os.environ["FINGERPRINT"].strip()
          fingerprints = set(re.findall(r"(?<![A-Za-z0-9+/])SHA256:([A-Za-z0-9+/]{43})(?:=)?(?![A-Za-z0-9+/=])", value))
          if len(fingerprints) != 1:
              raise SystemExit("La huella guardada debe contener una unica huella SHA256 completa del servidor.")
          print("SHA256:" + fingerprints.pop())
          PY
          )
          : > ~/.ssh/known_hosts
          while IFS= read -r host_key; do
            case "$host_key" in ""|\#*) continue ;; esac
            actual=$(printf '%s\n' "$host_key" | ssh-keygen -lf - -E sha256 | awk '{print $2}')
            if [ "$actual" = "$expected" ]; then
              printf '%s\n' "$host_key" >> ~/.ssh/known_hosts
            fi
          done < ~/.ssh/scanned_hosts
          test -s ~/.ssh/known_hosts || { echo "Ninguna clave del servidor coincide con la huella guardada. Conexion cancelada."; exit 1; }
          ssh -i ~/.ssh/gps_ci_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          docker exec -i gps-api node - <<'JS'
          const crypto=require('node:crypto');
          const http=require('node:http');
          const db=require('./db');
          const email='gps-smoke-'+crypto.randomBytes(12).toString('hex')+'@example.invalid';
          const password=crypto.randomBytes(32).toString('hex');
          const salt=crypto.randomBytes(16);
          let id=null,token=null;
          const request=(method,path,body,authorization)=>new Promise((resolve,reject)=>{
            const data=body?JSON.stringify(body):'';
            const req=http.request({host:'127.0.0.1',port:3000,path,method,timeout:6000,headers:{...(body?{'Content-Type':'application/json','Content-Length':Buffer.byteLength(data)}:{}),...(authorization?{Authorization:'Bearer '+authorization}:{})}},res=>{
              let output='';res.on('data',c=>{if(output.length<20000)output+=c});res.on('end',()=>{try{resolve({status:res.statusCode,body:JSON.parse(output||'{}')})}catch(e){reject(e)}})
            });req.on('error',reject);req.on('timeout',()=>req.destroy(Error('timeout')));req.end(data);
          });
          (async()=>{
            try{
              const hashed=await new Promise((resolve,reject)=>crypto.scrypt(password,salt,64,(e,k)=>e?reject(e):resolve(k)));
              const inserted=await db.query('INSERT INTO customer_accounts(email,password_hash,active) VALUES($1,$2,true) RETURNING id',[email,salt.toString('hex')+':'+hashed.toString('hex')]);
              id=inserted.rows[0].id;
              const login=await request('POST','/api/customer/login',{email,password});
              if(login.status!==200||!(/^[a-f0-9]{64}$/).test(login.body.token||''))throw Error('Valid login failed: HTTP '+login.status);
              token=login.body.token;
              console.log('Valid temporary account login: HTTP 200; token format valid (hidden)');
              for(const path of ['/api/customer/vehicles','/api/customer/positions']){
                const response=await request('GET',path,null,token);
                if(response.status!==200)throw Error(path+' HTTP '+response.status);
                const key=path.endsWith('vehicles')?'vehicles':'positions';
                if(!Array.isArray(response.body[key])||response.body[key].length!==0)throw Error('Temporary account could access unassigned vehicles');
                console.log(path+': HTTP 200; zero unauthorized records');
              }
              const logout=await request('POST','/api/customer/logout',null,token);
              if(logout.status!==204)throw Error('Logout failed: '+logout.status);
              const after=await request('GET','/api/customer/vehicles',null,token);
              if(after.status!==401)throw Error('Revoked token still works: '+after.status);
              console.log('Logout and session revocation: HTTP 204 then 401');
            }finally{
              if(id!==null){await db.query('DELETE FROM customer_accounts WHERE id=$1',[id]);console.log('Temporary test account and sessions deleted')}
              await db.end();
            }
          })().catch(e=>{console.error('Valid login smoke test FAILED:',e.message);process.exitCode=1});
          JS
          REMOTE
