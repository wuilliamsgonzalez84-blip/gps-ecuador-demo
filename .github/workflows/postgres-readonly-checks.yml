name: Pruebas API PostgreSQL aislada
on:
  push:
    paths:
      - 'integracion-postgres/**'
      - '.github/workflows/postgres-readonly-checks.yml'
  pull_request:
    paths:
      - 'integracion-postgres/**'
      - '.github/workflows/postgres-readonly-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: integracion-postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Validar sintaxis
        run: node --check index.js && node --check index.test.js
      - name: Ejecutar pruebas sin base de datos real
        run: npm test
