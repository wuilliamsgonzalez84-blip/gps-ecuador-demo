name: Verificar conexion SSH con Vultr
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-vultr-ssh.yml']
permissions:
  contents: read
jobs:
  ssh-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comprobar secretos requeridos
        env:
          HOST: ${{ secrets.GPS_VULTR_HOST }}
          USER: ${{ secrets.GPS_VULTR_USER }}
          SSH_KEY: ${{ secrets.GPS_VULTR_SSH_KEY }}
          FINGERPRINT: ${{ secrets.GPS_VULTR_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          for value in "$HOST" "$USER" "$SSH_KEY" "$FINGERPRINT"; do
            test -n "$value" || { echo "Falta un secreto requerido"; exit 1; }
          done
          echo "Cuatro secretos presentes"
      - name: Verificar identidad del servidor y acceso SSH sin cambios
        env:
          HOST: ${{ secrets.GPS_VULTR_HOST }}
          USER: ${{ secrets.GPS_VULTR_USER }}
          SSH_KEY: ${{ secrets.GPS_VULTR_SSH_KEY }}
          FINGERPRINT: ${{ secrets.GPS_VULTR_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          trap 'rm -f ~/.ssh/gps_ci_key ~/.ssh/known_hosts ~/.ssh/scanned_hosts' EXIT
          python3 - <<'PY'
          import os, re, base64, subprocess
          from pathlib import Path
          raw = os.environ["SSH_KEY"].strip().lstrip("\ufeff")
          raw = raw.replace("\\r\\n", "\n").replace("\\n", "\n").replace("\r", "")
          if raw[:1] in ("'", '"') and raw[-1:] == raw[:1]:
              raw = raw[1:-1].strip()
          if "-----BEGIN " not in raw:
              try:
                  raw = base64.b64decode(re.sub(r"\s+", "", raw), validate=True).decode("ascii")
              except (ValueError, UnicodeError):
                  raise SystemExit("El secreto no contiene una clave privada completa; recuperar la misma clave original.")
          match = re.fullmatch(r"\s*-----BEGIN (OPENSSH PRIVATE KEY|RSA PRIVATE KEY|EC PRIVATE KEY|PRIVATE KEY|ENCRYPTED PRIVATE KEY)-----\s*(.*?)\s*-----END \1-----\s*", raw, re.S)
          if not match:
              raise SystemExit("Cabecera o cierre de clave incompleto; recuperar la misma clave original.")
          kind, body = match.groups()
          if "Proc-Type:" in body:
              normalized = raw.strip() + "\n"
          else:
              body = re.sub(r"\s+", "", body)
              try:
                  base64.b64decode(body, validate=True)
              except ValueError:
                  raise SystemExit("Contenido de clave incompleto o alterado; recuperar la misma clave original.")
              normalized = "-----BEGIN " + kind + "-----\n" + "\n".join(body[i:i+64] for i in range(0, len(body), 64)) + "\n-----END " + kind + "-----\n"
          path = Path.home() / ".ssh/gps_ci_key"
          path.write_text(normalized, encoding="ascii")
          path.chmod(0o600)
          result = subprocess.run(["ssh-keygen", "-y", "-P", "", "-f", str(path)], stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
          if result.returncode:
              error = result.stderr.decode(errors="replace").lower()
              if "passphrase" in error or kind == "ENCRYPTED PRIVATE KEY":
                  raise SystemExit("La clave existente requiere frase de acceso.")
              raise SystemExit("La clave sigue incompleta o alterada tras normalizar; recuperar la misma clave original.")
          print("Clave privada existente validada; contenido oculto.")
          PY
          ssh-keyscan -T 10 -t ed25519,ecdsa,rsa "$HOST" 2>/dev/null > ~/.ssh/scanned_hosts
          test -s ~/.ssh/scanned_hosts || { echo "No se obtuvo clave publica del servidor"; exit 1; }
          # Accept the SHA256 token alone or the complete ssh-keygen output.
          # Require exactly one fingerprint; never trust an unverified scanned key.
          expected=$(python3 - <<'PY'
          import os, re
          value = os.environ["FINGERPRINT"].strip()
          fingerprints = set(re.findall(r"(?<![A-Za-z0-9+/])SHA256:([A-Za-z0-9+/]{43})(?:=)?(?![A-Za-z0-9+/=])", value))
          if len(fingerprints) != 1:
              raise SystemExit("La huella guardada debe contener una unica huella SHA256 completa del servidor.")
          print("SHA256:" + fingerprints.pop())
          PY
          )
          : > ~/.ssh/known_hosts
          while IFS= read -r host_key; do
            case "$host_key" in ""|\#*) continue ;; esac
            actual=$(printf '%s\n' "$host_key" | ssh-keygen -lf - -E sha256 | awk '{print $2}')
            if [ "$actual" = "$expected" ]; then
              printf '%s\n' "$host_key" >> ~/.ssh/known_hosts
            fi
          done < ~/.ssh/scanned_hosts
          test -s ~/.ssh/known_hosts || { echo "Ninguna clave del servidor coincide con la huella guardada. Conexion cancelada."; exit 1; }
          ssh -i ~/.ssh/gps_ci_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes "$USER@$HOST" 'printf "Conexion SSH confirmada; sin cambios en el servidor.\n"'

          echo "=== Diagnostico GPS Ecuador (solo lectura) ==="
          ssh -i ~/.ssh/gps_ci_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -u
          fail=0
          for service in gps-api gps-postgres; do
            state=$(docker inspect -f '{{.State.Running}}' "$service" 2>/dev/null || true)
            echo "$service running: ${state:-not_found}"
            [ "$state" = true ] || fail=1
          done
          if docker exec gps-postgres pg_isready >/dev/null 2>&1; then
            echo "PostgreSQL: accepting connections"
          else
            echo "PostgreSQL: unavailable"; fail=1
          fi
          docker exec gps-api node -e '
          const http=require("http");
          const paths=["/api/health","/api/vehicles/count"];
          Promise.all(paths.map(path=>new Promise(resolve=>{
            const req=http.get({hostname:"127.0.0.1",port:3000,path,timeout:12000},res=>{
              res.resume();res.on("end",()=>{console.log(path+" HTTP "+res.statusCode);resolve(res.statusCode===200)});
            });
            req.on("timeout",()=>req.destroy(new Error("timeout")));
            req.on("error",e=>{console.log(path+" ERROR "+(e.code||e.message));resolve(false)});
          }))).then(results=>{if(results.some(ok=>!ok))process.exitCode=1});
          ' || fail=1
          echo "=== Diagnostico SQL seguro ==="
          docker exec gps-api node -e '
          const db=require("./db");
          console.log("DB module exports:",Object.keys(db));
          const pool=db.pool||db;
          if(typeof pool.query!=="function"){console.log("DB pool query unavailable");process.exit(0)}
          const timer=setTimeout(()=>{console.log("DB query timeout after 12s");process.exit(1)},12000);
          Promise.resolve(pool.query("SELECT COUNT(*) AS total FROM vehicles")).then(r=>{clearTimeout(timer);console.log("DB COUNT:",r.rows?.[0]?.total);process.exit(0)}).catch(e=>{clearTimeout(timer);console.log("DB ERROR:",e.code||e.message);process.exit(1)});
          ' || true
          echo "=== PostgreSQL connection diagnostics (no secrets) ==="
          docker exec gps-api node -e '
          const db=require("./db");const opts=db.options||{};
          const safeHost=String(opts.host||"").replace(/[^a-zA-Z0-9_.-]/g,"?");
          console.log("PG host:",safeHost||"(default)","port:",opts.port||"(default)","database configured:",!!opts.database,"user configured:",!!opts.user);
          const net=require("net");const host=opts.host||"localhost",port=Number(opts.port||5432);
          const s=net.connect({host,port,timeout:4000});
          s.on("connect",()=>{console.log("PostgreSQL TCP reachable");s.destroy()});
          s.on("timeout",()=>{console.log("PostgreSQL TCP timeout");s.destroy()});
          s.on("error",e=>console.log("PostgreSQL TCP error:",e.code||e.message));
          '
          echo "Docker networks:"
          docker inspect -f '{{.Name}} {{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' gps-api gps-postgres
          echo "Postgres recent errors (filtered):"
          docker logs --tail 30 gps-postgres 2>&1 | grep -Ei 'error|fatal|could not|timeout|ready to accept' | tail -10 || true
          echo "Teltonika service active: $(systemctl is-active gps-teltonika.service 2>/dev/null || true)"
          echo "Privacy/authentication: NOT verified by this read-only diagnostic"
          exit "$fail"
          REMOTE
