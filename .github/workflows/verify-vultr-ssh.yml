name: Verificar conexion SSH con Vultr
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-vultr-ssh.yml']
permissions:
  contents: read
jobs:
  ssh-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comprobar secretos requeridos
        env:
          HOST: ${{ secrets.GPS_VULTR_HOST }}
          USER: ${{ secrets.GPS_VULTR_USER }}
          SSH_KEY: ${{ secrets.GPS_VULTR_SSH_KEY }}
          FINGERPRINT: ${{ secrets.GPS_VULTR_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          for value in "$HOST" "$USER" "$SSH_KEY" "$FINGERPRINT"; do
            test -n "$value" || { echo "Falta un secreto requerido"; exit 1; }
          done
          echo "Cuatro secretos presentes"
      - name: Verificar identidad del servidor y acceso SSH sin cambios
        env:
          HOST: ${{ secrets.GPS_VULTR_HOST }}
          USER: ${{ secrets.GPS_VULTR_USER }}
          SSH_KEY: ${{ secrets.GPS_VULTR_SSH_KEY }}
          FINGERPRINT: ${{ secrets.GPS_VULTR_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          trap 'rm -f ~/.ssh/gps_ci_key ~/.ssh/known_hosts ~/.ssh/scanned_hosts' EXIT
          python3 - <<'PY'
          import os, re, base64, subprocess
          from pathlib import Path
          raw = os.environ["SSH_KEY"].strip().lstrip("\ufeff")
          raw = raw.replace("\\r\\n", "\n").replace("\\n", "\n").replace("\r", "")
          if raw[:1] in ("'", '"') and raw[-1:] == raw[:1]:
              raw = raw[1:-1].strip()
          if "-----BEGIN " not in raw:
              try:
                  raw = base64.b64decode(re.sub(r"\s+", "", raw), validate=True).decode("ascii")
              except (ValueError, UnicodeError):
                  raise SystemExit("El secreto no contiene una clave privada completa; recuperar la misma clave original.")
          match = re.fullmatch(r"\s*-----BEGIN (OPENSSH PRIVATE KEY|RSA PRIVATE KEY|EC PRIVATE KEY|PRIVATE KEY|ENCRYPTED PRIVATE KEY)-----\s*(.*?)\s*-----END \1-----\s*", raw, re.S)
          if not match:
              raise SystemExit("Cabecera o cierre de clave incompleto; recuperar la misma clave original.")
          kind, body = match.groups()
          if "Proc-Type:" in body:
              normalized = raw.strip() + "\n"
          else:
              body = re.sub(r"\s+", "", body)
              try:
                  base64.b64decode(body, validate=True)
              except ValueError:
                  raise SystemExit("Contenido de clave incompleto o alterado; recuperar la misma clave original.")
              normalized = "-----BEGIN " + kind + "-----\n" + "\n".join(body[i:i+64] for i in range(0, len(body), 64)) + "\n-----END " + kind + "-----\n"
          path = Path.home() / ".ssh/gps_ci_key"
          path.write_text(normalized, encoding="ascii")
          path.chmod(0o600)
          result = subprocess.run(["ssh-keygen", "-y", "-P", "", "-f", str(path)], stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
          if result.returncode:
              error = result.stderr.decode(errors="replace").lower()
              if "passphrase" in error or kind == "ENCRYPTED PRIVATE KEY":
                  raise SystemExit("La clave existente requiere frase de acceso.")
              raise SystemExit("La clave sigue incompleta o alterada tras normalizar; recuperar la misma clave original.")
          print("Clave privada existente validada; contenido oculto.")
          PY
          ssh-keyscan -T 10 -t ed25519,ecdsa,rsa "$HOST" 2>/dev/null > ~/.ssh/scanned_hosts
          test -s ~/.ssh/scanned_hosts || { echo "No se obtuvo clave publica del servidor"; exit 1; }
          # Accept the SHA256 token alone or the complete ssh-keygen output.
          # Require exactly one fingerprint; never trust an unverified scanned key.
          expected=$(python3 - <<'PY'
          import os, re
          value = os.environ["FINGERPRINT"].strip()
          fingerprints = set(re.findall(r"(?<![A-Za-z0-9+/])SHA256:([A-Za-z0-9+/]{43})(?:=)?(?![A-Za-z0-9+/=])", value))
          if len(fingerprints) != 1:
              raise SystemExit("La huella guardada debe contener una unica huella SHA256 completa del servidor.")
          print("SHA256:" + fingerprints.pop())
          PY
          )
          : > ~/.ssh/known_hosts
          while IFS= read -r host_key; do
            case "$host_key" in ""|\#*) continue ;; esac
            actual=$(printf '%s\n' "$host_key" | ssh-keygen -lf - -E sha256 | awk '{print $2}')
            if [ "$actual" = "$expected" ]; then
              printf '%s\n' "$host_key" >> ~/.ssh/known_hosts
            fi
          done < ~/.ssh/scanned_hosts
          test -s ~/.ssh/known_hosts || { echo "Ninguna clave del servidor coincide con la huella guardada. Conexion cancelada."; exit 1; }
          ssh -i ~/.ssh/gps_ci_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes "$USER@$HOST" 'printf "Conexion SSH confirmada; sin cambios en el servidor.\n"'

          echo "=== Safe PostgreSQL hostname repair ==="
          ssh -i ~/.ssh/gps_ci_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes "$USER@$HOST" 'bash -s' <<'REPAIR'
          set -euo pipefail
          mount=$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/app"}}{{.Source}}{{end}}{{end}}' gps-api)
          test -n "$mount" && test -f "$mount/db.js"
          test "$(docker exec gps-api node -e 'const n=require("net").connect({host:"gps-postgres",port:5432,timeout:3000});n.on("connect",()=>{console.log("yes");n.destroy()});n.on("error",()=>process.exit(1));n.on("timeout",()=>process.exit(1))')" = yes
          backup="$mount/db.js.backup-before-postgres-host-fix"
          if [ ! -e "$backup" ]; then cp -p "$mount/db.js" "$backup"; fi
          python3 - "$mount/db.js" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1])
          s=p.read_text()
          if '172.17.0.2' in s:
              updated=s.replace('172.17.0.2','gps-postgres')
              p.write_text(updated)
              print("Updated database hostname to Docker DNS")
          elif 'gps-postgres' in s:
              print("Database hostname already updated")
          else:
              raise SystemExit("Unexpected database configuration: no changes applied")
          PY
          docker restart gps-api >/dev/null
          sleep 3
          if docker exec gps-api node -e '
          const http=require("http");const req=http.get({hostname:"127.0.0.1",port:3000,path:"/api/vehicles/count",timeout:8000},res=>{
            console.log("Vehicle count HTTP",res.statusCode);res.resume();res.on("end",()=>process.exit(res.statusCode===200?0:1));
          });req.on("timeout",()=>req.destroy(new Error("timeout")));req.on("error",e=>{console.log("Vehicle count error",e.code||e.message);process.exit(1)});
          '; then
            echo "Database hostname repair validated: HTTP 200"
          else
            echo "Vehicle count still failing; restore original file and restart"
            cp -p "$backup" "$mount/db.js"
            docker restart gps-api >/dev/null
            exit 1
          fi
          REPAIR
          echo "=== Privacy and Teltonika checks (read only) ==="
          ssh -i ~/.ssh/gps_ci_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes "$USER@$HOST" 'bash -s' <<'PRIVACY'
          set -u
          echo "API port mappings:"
          docker port gps-api 2>/dev/null || true
          echo "API network mode: $(docker inspect -f '{{.HostConfig.NetworkMode}}' gps-api)"
          echo "API internal listening ports:"
          docker exec gps-api node -e '
          const http=require("http");
          const paths=["/api/health","/api/vehicles/count"];
          Promise.all(paths.map(p=>new Promise(resolve=>{
            const q=http.get({host:"127.0.0.1",port:3000,path:p,timeout:5000},r=>{r.resume();r.on("end",()=>{console.log(p+" HTTP "+r.statusCode);resolve()})});
            q.on("error",e=>{console.log(p+" error "+e.code);resolve()});
          })));
          '
          echo "Teltonika service: $(systemctl is-active gps-teltonika.service 2>/dev/null || true)"
          echo "Teltonika port listener:"
          ss -lnt | grep -E '(:5028[[:space:]]|:5028$)' || echo "Port 5028 not listening"
          echo "Teltonika unit configuration keys (values hidden):"
          systemctl show gps-teltonika.service -p ExecStart -p WorkingDirectory -p User --no-pager | sed -E 's/ExecStart=.*/ExecStart=[configured, hidden]/'
          echo "Recent Teltonika journal levels:"
          journalctl -u gps-teltonika.service -n 15 --no-pager -o cat 2>/dev/null | grep -Ei 'error|fail|listen|started' | sed -E 's/[0-9]{10,}/[redacted]/g' | tail -8 || true
          echo "Note: Authentication and authorization of location endpoints need explicit protected-route tests."
          PRIVACY
          echo "=== Protected location endpoint tests (no location content) ==="
          ssh -i ~/.ssh/gps_ci_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes "$USER@$HOST" 'bash -s' <<'AUTH'
          set -euo pipefail
          echo "Location routes referenced by deployed API (paths only):"
          docker exec gps-api sh -c "grep -En 'app\\.(get|post|use)|router\\.(get|post|use)' /app/server.js | sed -E 's/.*(app|router)\\.(get|post|use)\\(([^,]*).*/\\1.\\2(\\3)/' | head -35" || true
          echo "Testing likely sensitive routes with no token (status only):"
          docker exec gps-api node -e '
          const http=require("http");
          const routes=["/api/vehicles","/api/vehicles/count","/api/positions","/api/locations","/api/tracking","/api/history"];
          Promise.all(routes.map(path=>new Promise(resolve=>{
            const q=http.get({hostname:"127.0.0.1",port:3000,path,timeout:5000},res=>{
              res.resume();res.on("end",()=>{console.log(path+" unauthenticated HTTP "+res.statusCode);resolve({path,status:res.statusCode})});
            });
            q.on("timeout",()=>q.destroy(new Error("timeout")));
            q.on("error",e=>{console.log(path+" request error "+(e.code||e.message));resolve({path,status:0})});
          }))).then(results=>{
            const sensitive=results.filter(x=>x.path!=="/api/vehicles/count");
            const exposed=sensitive.filter(x=>x.status===200);
            if(exposed.length){console.log("WARNING: unauthenticated sensitive endpoints returned 200");process.exitCode=2}
            else console.log("No tested sensitive path returned HTTP 200 without authentication");
          });
          '
          AUTH
          echo "=== Database schema preflight for private tracking routes ==="
          ssh -i ~/.ssh/gps_ci_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes "$USER@$HOST" 'bash -s' <<'SCHEMA'
          set -euo pipefail
          docker exec gps-api node -e '
          const db=require("./db");
          db.query("SELECT table_name,column_name,data_type FROM information_schema.columns WHERE table_schema=$1 AND table_name=ANY($2::text[]) ORDER BY table_name,ordinal_position",["public",["vehicles","positions"]]).then(r=>{for(const x of r.rows)console.log(x.table_name+"."+x.column_name+" "+x.data_type);return db.end()}).catch(e=>{console.log("Schema preflight failed",e.code);process.exit(1)})
          '
          SCHEMA
          echo "=== Install authenticated private tracking routes ==="
          ssh -i ~/.ssh/gps_ci_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes "$USER@$HOST" 'bash -s' <<'PRIVATE'
          set -euo pipefail
          appdir=$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/app"}}{{.Source}}{{end}}{{end}}' gps-api)
          test -n "$appdir" && test -f "$appdir/server.js"
          umask 077
          curl --fail --silent --show-error --location --max-time 15 'https://raw.githubusercontent.com/wuilliamsgonzalez84-blip/gps-ecuador-demo/abd52a673e10419af2ccce7acc96bdd487da37aa/backend/private-routes.cjs' -o "$appdir/private-routes.cjs.tmp"
          mv "$appdir/private-routes.cjs.tmp" "$appdir/private-routes.cjs"
          docker exec gps-api node --check /app/private-routes.cjs
          test -f "$appdir/.private-tracking-token" || openssl rand -hex 32 > "$appdir/.private-tracking-token"
          test -f "$appdir/.private-tracking-vehicles" || printf '1\n' > "$appdir/.private-tracking-vehicles"
          test -f "$appdir/server.js.backup-before-private-routes" || cp -p "$appdir/server.js" "$appdir/server.js.backup-before-private-routes"
          python3 - "$appdir/server.js" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          line="app.use('/api', require('./private-routes.cjs')(pool));"
          if line not in s:
              if "app.listen(" not in s or "const pool = require('./db')" not in s: raise SystemExit("Unexpected API structure")
              p.write_text(s.replace("app.listen(",line+"\napp.listen(",1))
          PY
          docker exec gps-api node --check /app/server.js
          docker restart gps-api >/dev/null
          sleep 3
          if ! docker exec gps-api node -e '
          const http=require("http"),fs=require("fs"),token=fs.readFileSync("/app/.private-tracking-token","utf8").trim();
          const test=(path,auth)=>new Promise((resolve,reject)=>{const q=http.get({hostname:"127.0.0.1",port:3000,path,headers:auth?{Authorization:"Bearer "+token}:{},timeout:5000},r=>{r.resume();r.on("end",()=>resolve(r.statusCode))});q.on("error",reject);q.on("timeout",()=>q.destroy(new Error("timeout")))});
          (async()=>{let ok=true;for(const [p,a,expected] of [["/api/vehicles",false,401],["/api/positions",false,401],["/api/history",false,401],["/api/vehicles",true,200],["/api/positions",true,200],["/api/history?vehicleId=999999&from=2026-11-01T00%3A00%3A00Z&to=2026-11-02T00%3A00%3A00Z",true,403],["/api/history?vehicleId=1&from=2026-11-01T00%3A00%3A00Z&to=2026-11-02T00%3A00%3A00Z",true,200]]){const status=await test(p,a);console.log(p.split("?")[0],a?"authorized":"anonymous",status,"expected",expected);if(status!==expected)ok=false}process.exit(ok?0:1)})().catch(e=>{console.error(e.code||e.message);process.exit(1)});
          '; then
            cp -p "$appdir/server.js.backup-before-private-routes" "$appdir/server.js"
            docker restart gps-api >/dev/null
            echo "Validation failed; restored original API"
            exit 1
          fi
          echo "Private tracking routes verified"
          PRIVATE
          echo "=== Deploy customer-isolated tracking accounts ==="
          ssh -i ~/.ssh/gps_ci_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes "$USER@$HOST" 'bash -s' <<'CUSTOMERS'
          set -euo pipefail
          appdir=$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/app"}}{{.Source}}{{end}}{{end}}' gps-api)
          test -n "$appdir" && test -f "$appdir/server.js"
          curl --fail --silent --show-error --location --max-time 15 'https://raw.githubusercontent.com/wuilliamsgonzalez84-blip/gps-ecuador-demo/fa54dd7217a52900537db06f9843d5c3e450ef56/backend/customer-routes.cjs' -o "$appdir/customer-routes.cjs.tmp"
          curl --fail --silent --show-error --location --max-time 15 'https://raw.githubusercontent.com/wuilliamsgonzalez84-blip/gps-ecuador-demo/fa54dd7217a52900537db06f9843d5c3e450ef56/backend/sql/customer-accounts.sql' -o "$appdir/customer-accounts.sql.tmp"
          mv "$appdir/customer-routes.cjs.tmp" "$appdir/customer-routes.cjs"
          mv "$appdir/customer-accounts.sql.tmp" "$appdir/customer-accounts.sql"
          docker exec gps-api node --check /app/customer-routes.cjs
          docker exec gps-api node -e 'const fs=require("fs"),db=require("./db");db.query(fs.readFileSync("/app/customer-accounts.sql","utf8")).then(()=>{console.log("Customer schema migrated successfully");return db.end()}).catch(e=>{console.error("Customer schema migration failed",e.code||e.message);process.exit(1)})'
          test -f "$appdir/server.js.backup-before-customers" || cp -p "$appdir/server.js" "$appdir/server.js.backup-before-customers"
          python3 - "$appdir/server.js" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);s=p.read_text()
          line="app.use('/api/customer', require('./customer-routes.cjs')(pool));"
          old="app.use('/api', require('./private-routes.cjs')(pool));"
          if "app.listen(" not in s or "const pool = require('./db')" not in s: raise SystemExit("Unexpected API structure")
          s=s.replace(line+"\n","")
          if old not in s: raise SystemExit("Private routes mount not found")
          s=s.replace(old,line+"\n"+old,1)
          p.write_text(s)
          PY
          docker exec gps-api node --check /app/server.js
          docker restart gps-api >/dev/null
          sleep 3
          if ! docker exec gps-api node -e '
          const http=require("http");
          const cases=[["GET","/api/customer/vehicles",401],["GET","/api/customer/positions",401],["GET","/api/customer/history",401],["POST","/api/customer/login",400],["GET","/api/health",200]];
          (async()=>{for(const [method,path,expected] of cases){const status=await new Promise((resolve,reject)=>{const q=http.request({hostname:"127.0.0.1",port:3000,path,method,timeout:5000},r=>{r.resume();r.on("end",()=>resolve(r.statusCode))});q.on("error",reject);q.on("timeout",()=>q.destroy(new Error("timeout")));q.end()});console.log(method,path,"HTTP",status);if(status!==expected)process.exitCode=1}})().catch(e=>{console.error(e.code||e.message);process.exit(1)});
          '; then
            cp -p "$appdir/server.js.backup-before-customers" "$appdir/server.js"
            docker restart gps-api >/dev/null
            echo "Customer route verification failed; original API restored"
            exit 1
          fi
          echo "Customer routes deployed; no customer accounts created"
          CUSTOMERS
          echo "=== HTTPS/domain inventory (read-only) ==="
          ssh -i ~/.ssh/gps_ci_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes "$USER@$HOST" 'bash -s' <<'HTTPS_AUDIT'
          set -eu
          for bin in caddy nginx certbot; do if command -v "$bin" >/dev/null 2>&1; then echo "$bin installed"; else echo "$bin not installed"; fi; done
          for port in 80 443 3000; do if ss -lnt "( sport = :$port )" | grep -q LISTEN; then echo "port $port listening"; else echo "port $port not listening"; fi; done
          echo "Proxy service statuses:"
          for svc in caddy nginx; do systemctl is-active "$svc" 2>/dev/null || true; done
          echo "Certificates count:"
          find /etc/letsencrypt/live -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l || true
          echo "Domain references (no secrets):"
          for f in /etc/caddy/Caddyfile /etc/nginx/sites-enabled/default; do if [ -f "$f" ]; then grep -E '^[[:space:]]*([a-zA-Z0-9.-]+[[:space:]]*\\{|server_name[[:space:]])' "$f" | head -5 || true; fi; done
          HTTPS_AUDIT
          echo "=== HTTPS preflight (read-only) ==="
          ssh -i ~/.ssh/gps_ci_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes "$USER@$HOST" 'bash -s' <<'TLS_PREFLIGHT'
          set -eu
          echo "Public DNS for temporary TLS hostname:"
          getent ahostsv4 45-77-197-18.sslip.io | awk '{print $1}' | sort -u | head -3 || true
          echo "Public IP via local route:"
          ip -4 route get 1.1.1.1 | sed -E 's/src [0-9.]+/src [redacted]/g' | head -1 || true
          echo "Firewall UFW:"
          ufw status 2>/dev/null | head -12 || true
          echo "Firewall nftables:"
          if command -v nft >/dev/null 2>&1; then nft list ruleset 2>/dev/null | grep -E 'dport (80|443|3000)|policy (drop|accept)' | head -12 || true; fi
          echo "API Docker port bindings:"
          docker inspect -f '{{json .HostConfig.PortBindings}}' gps-api
          echo "Caddy package availability:"
          apt-cache policy caddy 2>/dev/null | grep -E 'Installed:|Candidate:' | head -2 || true
          TLS_PREFLIGHT
          echo "=== HTTPS upstream reachability (read-only) ==="
          ssh -i ~/.ssh/gps_ci_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes "$USER@$HOST" 'bash -s' <<'UPSTREAM'
          set -eu
          for host in 127.0.0.1 localhost; do
            code=$(curl --noproxy '*' -s -o /dev/null -w '%{http_code}' --max-time 3 "http://$host:3000/api/health" || true)
            echo "$host:3000 health HTTP ${code:-unreachable}"
          done
          docker inspect -f 'API network mode: {{.HostConfig.NetworkMode}}' gps-api
          echo "Docker API IPs:"
          docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}={{$v.IPAddress}} {{end}}' gps-api
          UPSTREAM
          echo "=== Caddy TLS failure diagnostic (read-only) ==="
          ssh -i ~/.ssh/gps_ci_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes "$USER@$HOST" 'bash -s' <<'TLS_DIAG'
          set -eu
          echo "Service: $(systemctl is-active caddy)"
          ss -lnt | grep -E ':(80|443)[[:space:]]' || true
          echo "TLS request diagnostics:"
          curl --noproxy '*' -v --max-time 10 -o /dev/null https://45-77-197-18.sslip.io/api/customer/vehicles 2>&1 | grep -Ei 'SSL|TLS|certificate|HTTP/|error|connected|resolve|handshake' | tail -16 || true
          echo "Caddy certificate events:"
          journalctl -u caddy --since '15 minutes ago' --no-pager -o cat | grep -Ei 'certificate|acme|challenge|error|issuer|obtaining|authorization|rate limit' | tail -30 || true
          TLS_DIAG
          echo "=== Diagnostico GPS Ecuador (solo lectura) ==="
          ssh -i ~/.ssh/gps_ci_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -u
          fail=0
          for service in gps-api gps-postgres; do
            state=$(docker inspect -f '{{.State.Running}}' "$service" 2>/dev/null || true)
            echo "$service running: ${state:-not_found}"
            [ "$state" = true ] || fail=1
          done
          if docker exec gps-postgres pg_isready >/dev/null 2>&1; then
            echo "PostgreSQL: accepting connections"
          else
            echo "PostgreSQL: unavailable"; fail=1
          fi
          docker exec gps-api node -e '
          const http=require("http");
          const paths=["/api/health","/api/vehicles/count"];
          Promise.all(paths.map(path=>new Promise(resolve=>{
            const req=http.get({hostname:"127.0.0.1",port:3000,path,timeout:12000},res=>{
              res.resume();res.on("end",()=>{console.log(path+" HTTP "+res.statusCode);resolve(res.statusCode===200)});
            });
            req.on("timeout",()=>req.destroy(new Error("timeout")));
            req.on("error",e=>{console.log(path+" ERROR "+(e.code||e.message));resolve(false)});
          }))).then(results=>{if(results.some(ok=>!ok))process.exitCode=1});
          ' || fail=1
          echo "=== Diagnostico SQL seguro ==="
          docker exec gps-api node -e '
          const db=require("./db");
          console.log("DB module exports:",Object.keys(db));
          const pool=db.pool||db;
          if(typeof pool.query!=="function"){console.log("DB pool query unavailable");process.exit(0)}
          const timer=setTimeout(()=>{console.log("DB query timeout after 12s");process.exit(1)},12000);
          Promise.resolve(pool.query("SELECT COUNT(*) AS total FROM vehicles")).then(r=>{clearTimeout(timer);console.log("DB COUNT:",r.rows?.[0]?.total);process.exit(0)}).catch(e=>{clearTimeout(timer);console.log("DB ERROR:",e.code||e.message);process.exit(1)});
          ' || true
          echo "=== PostgreSQL connection diagnostics (no secrets) ==="
          docker exec gps-api node -e '
          const db=require("./db");const opts=db.options||{};
          const safeHost=String(opts.host||"").replace(/[^a-zA-Z0-9_.-]/g,"?");
          console.log("PG host:",safeHost||"(default)","port:",opts.port||"(default)","database configured:",!!opts.database,"user configured:",!!opts.user);
          const net=require("net");const host=opts.host||"localhost",port=Number(opts.port||5432);
          const s=net.connect({host,port,timeout:4000});
          s.on("connect",()=>{console.log("PostgreSQL TCP reachable");s.destroy()});
          s.on("timeout",()=>{console.log("PostgreSQL TCP timeout");s.destroy()});
          s.on("error",e=>console.log("PostgreSQL TCP error:",e.code||e.message));
          '
          echo "Docker networks:"
          docker inspect -f '{{.Name}} {{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' gps-api gps-postgres
          echo "Postgres recent errors (filtered):"
          docker logs --tail 30 gps-postgres 2>&1 | grep -Ei 'error|fatal|could not|timeout|ready to accept' | tail -10 || true
          echo "=== Compare configured database endpoint safely ==="
          docker inspect -f 'postgres network addresses: {{range $k,$v := .NetworkSettings.Networks}}{{$k}}={{$v.IPAddress}} {{end}}' gps-postgres
          docker exec gps-api node -e '
          const o=require("./db").options||{};
          console.log("API database host:",o.host,"port:",o.port,"database present:",!!o.database,"user present:",!!o.user);
          '
          docker exec gps-postgres sh -c 'printf "POSTGRES_USER configured: "; test -n "$POSTGRES_USER" && echo yes || echo no; printf "POSTGRES_DB configured: "; test -n "$POSTGRES_DB" && echo yes || echo no'
          docker inspect -f 'API restart policy: {{.HostConfig.RestartPolicy.Name}} image: {{.Config.Image}}' gps-api
          echo "=== Pre-repair validation (no secrets) ==="
          docker exec gps-api node -e '
          const d=require("./db"),net=require("net");
          const s=net.connect({host:"gps-postgres",port:5432,timeout:3000});
          s.on("connect",()=>{console.log("Service DNS/TCP: reachable");s.destroy()});
          s.on("timeout",()=>{console.log("Service DNS/TCP: timeout");s.destroy()});
          s.on("error",e=>console.log("Service DNS/TCP:",e.code));
          '
          docker exec gps-api node -e '
          const fs=require("fs");const s=fs.readFileSync("/app/db.js","utf8");
          console.log("db.js uses PGHOST:",s.includes("PGHOST"),"uses hardcoded IP:",s.includes("172.17.0.2"));
          '
          docker inspect -f 'API mounts: {{range .Mounts}}{{.Destination}} ({{.Type}}) {{end}}' gps-api
          docker exec gps-api node -e '
          const db=require("./db");const u=db.options?.user||"";
          console.log("API user configured:",!!u);
          '
          docker exec gps-postgres sh -c 'test -n "$POSTGRES_USER" && echo "Postgres initial user configured"'
          echo "Teltonika service active: $(systemctl is-active gps-teltonika.service 2>/dev/null || true)"
          echo "Privacy/authentication: NOT verified by this read-only diagnostic"
          exit "$fail"
