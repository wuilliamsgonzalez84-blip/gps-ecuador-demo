<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPS Ecuador | Mapa privado</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{font-family:system-ui,sans-serif;color:#f8fafc;background:#0c1729}
*{box-sizing:border-box}body{margin:0}header{padding:14px 20px;background:#17283e;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-size:20px;margin:0}main{padding:14px;max-width:1150px;margin:auto}#map{height:65vh;min-height:340px;border-radius:12px;background:#17283e}
button,a.button{background:#34d399;color:#052e16;border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none}
#status{min-height:30px;color:#cbd5e1}#vehicles{padding:12px 0}#vehicles li{margin:7px 0}
</style></head><body>
<header><h1>🛰️ GPS Ecuador · Mis vehículos</h1><div><button id="refresh">Actualizar</button> <button id="logout">Cerrar sesión</button></div></header>
<main><p id="status" role="status" aria-live="polite">Comprobando sesión…</p><div id="map" aria-label="Mapa de vehículos autorizados"></div><ul id="vehicles"></ul><p>Solo se muestran posiciones de vehículos asignados a tu cuenta. Las ubicaciones dependen de los últimos registros del servidor; no son necesariamente en tiempo real.</p></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const status=document.getElementById('status'),list=document.getElementById('vehicles');
const map=L.map('map').setView([-1.83,-78.18],6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const markers=new Map();let timer=null,active=true,loading=false;
async function api(path,options={}) {
 const response=await fetch(path,{...options,credentials:'same-origin',cache:'no-store'});
 if(response.status===401){stop();location.replace('client-login.html');throw Error('Sesión caducada');}
 if(!response.ok)throw Error('Servicio temporalmente no disponible');
 return response.json();
}
function stop(){active=false;if(timer)clearInterval(timer);timer=null;}
async function refresh(){
 if(!active||loading)return;loading=true;
 try{
  const [v,p]=await Promise.all([api('/api/vehicles'),api('/api/positions')]);
  if(!active)return;
  const vehicles=Array.isArray(v.vehicles)?v.vehicles:[];
  const ids=new Set(vehicles.map(x=>x.id));
  const positions=Array.isArray(p.positions)?p.positions.filter(x=>ids.has(x.deviceId)):[];
  const seen=new Set(),bounds=[];
  list.replaceChildren();
  for(const vehicle of vehicles){
   const item=document.createElement('li');
   const fix=positions.find(x=>x.deviceId===vehicle.id);
   item.textContent=String(vehicle.name||'Vehículo')+(fix?' · Última posición: '+new Date(fix.fixTime).toLocaleString():' · Sin ubicación registrada');
   list.append(item);
  }
  for(const fix of positions){
   if(!Number.isFinite(fix.latitude)||!Number.isFinite(fix.longitude)||Math.abs(fix.latitude)>90||Math.abs(fix.longitude)>180)continue;
   const xy=[fix.latitude,fix.longitude],key=String(fix.deviceId);
   seen.add(key);bounds.push(xy);
   let marker=markers.get(key);
   if(!marker){marker=L.marker(xy).addTo(map);markers.set(key,marker);}
   else marker.setLatLng(xy);
   const vehicle=vehicles.find(x=>x.id===fix.deviceId);
   const label=document.createElement('span');label.textContent=String(vehicle?.name||'Vehículo');
   marker.unbindPopup();marker.bindPopup(label);
  }
  for(const [key,marker] of markers){if(!seen.has(key)){map.removeLayer(marker);markers.delete(key);}}
  if(bounds.length&& !map._gpsFitted){map.fitBounds(bounds,{padding:[30,30],maxZoom:15});map._gpsFitted=true;}
  status.textContent='Vehículos autorizados: '+vehicles.length+' · Posiciones disponibles: '+bounds.length+' · Actualizado: '+new Date().toLocaleTimeString();
 }catch(err){if(active)status.textContent=err.message;}
 finally{loading=false;}
}
document.getElementById('refresh').addEventListener('click',refresh);
document.getElementById('logout').addEventListener('click',async()=>{
 try{await api('/api/logout',{method:'POST'});}finally{stop();location.replace('client-login.html');}
});
api('/api/me').then(()=>{refresh();timer=setInterval(refresh,30000);}).catch(()=>{});
window.addEventListener('pagehide',stop);
</script></body></html>
